; Console noise on Mac / UE 5.8:
; - LogTemp "Failed to fetch vm statistics" = host_statistics64 failing (ApplePlatformMemory); ignore.
; - LogHAL idevice_id Bad CPU type = x86 iOS tool on Apple Silicon; ignore (not used for Mac game).
; Project logs use LogSailSim so we can mute LogTemp without losing SailSim diagnostics.
[Core.Log]
LogTemp=Error
LogHAL=Error
LogSailSim=Log


[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1

r.GenerateMeshDistanceFields=True

; --- SailSim lighting: keep Lumen quality; win FPS from content architecture ---
; ScreenProbeGather.DownsampleFactor 16 = Epic default (full GI quality).
; Do NOT aggressive-downsample GI — harbor cost is PMC land / lights / water extent.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; Lumen reflections half-res (Epic High). Full-res (1) is Cine fill cost on open water.
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.MaxRoughnessToTrace=0.4
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16
r.Lumen.ScreenProbeGather.RadianceCache.NumProbesToTraceBudget=100
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.ScreenProbeGather.IrradianceFormat=1
r.Lumen.ScreenProbeGather.StochasticInterpolation=1
r.Lumen.ScreenProbeGather.ShortRangeAO.DownsampleFactor=1
r.Lumen.TraceMeshSDFs.Allow=0
; Screen-space fallback for hull water flash at grazing angles.
r.SSR.Quality=3
r.SSR.HalfResSceneColor=1

; Virtual shadow maps — open ocean has few casters (hull, spars, shore).
; Soften from Cine toward Epic: same look near boat, less waste on distant water.
r.Shadow.DistanceScale=0.85
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=-0.5
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=4
r.Shadow.Virtual.SMRT.RayCountLocal=8
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=4
; Skip coarse pages for tiny distant casters (cheap cull, rare quality hit at sea).
r.Shadow.RadiusThreshold=0.04

r.SkinCache.CompileShaders=True

; Mac-first: hardware RT often costs without a matching win on open water.
; Re-enable only if A/B proves better hull reflections vs GI/SSR path.
r.RayTracing=False

r.RayTracing.RayTracingProxies.ProjectEnabled=True

r.Substrate=True

r.Substrate.ProjectGBufferFormat=0

r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8

r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

; Thin dynamic sail yarns / race numbers: motion blur + weak TAA history reads as
; crawling pixels when PMC vertices update every frame (not Nanite — sails are
; ProceduralMesh). Disable motion blur; prefer TSR over classic TAA.
r.DefaultFeature.MotionBlur=False
r.MotionBlurQuality=0
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=1

