; Unreal MCP server settings.
; The settings class is UCLASS(config=EditorPerProjectUserSettings), so these keys
; are only read from the EditorPerProjectUserSettings hierarchy — putting them in
; DefaultEditor.ini (config=Editor) silently does nothing. Keep them here.
; Loopback server for Grok/Claude; port 8765 avoids the 8000 conflict with sail-sim's FastAPI.
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
ServerUrlPath=/mcp
ServerPortNumber=8765
bAutoStartServer=True
bEnableToolSearch=True
